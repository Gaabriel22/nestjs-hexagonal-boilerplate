name: nestjs-hexagonal-boilerplate

services:
  api:
    build:
      context: .
      target: development
    init: true
    command:
      - sh
      - -c
      - npm run db:generate && npm run db:migrate:deploy && npm run dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app?schema=public}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-development-access-token-secret-change-me}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_HASH_SECRET: ${AUTH_REFRESH_TOKEN_HASH_SECRET:-development-refresh-token-secret-change-me}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      DOCS_OPENAPI_PATH: ${DOCS_OPENAPI_PATH:-/openapi.json}
      DOCS_REFERENCE_PATH: ${DOCS_REFERENCE_PATH:-/reference}
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
